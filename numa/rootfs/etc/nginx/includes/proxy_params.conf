proxy_http_version          1.1;
proxy_ignore_client_abort   off;
proxy_read_timeout          86400s;
proxy_redirect              off;
proxy_send_timeout          86400s;
proxy_max_temp_file_size    0;

proxy_set_header Accept-Encoding    "";
proxy_set_header Connection         $connection_upgrade;

# Numa v0.24.0 gates loopback API requests unless Host names this host
# (localhost, a .localhost name, an IP literal, or a *.numa name). Home
# Assistant Ingress sends the HA hostname, so forwarding $http_host would make
# the dashboard reply 401. Rewrite Host to a name Numa always accepts.
proxy_set_header Host               localhost;

proxy_set_header Upgrade            $http_upgrade;
proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto  $scheme;
proxy_set_header X-NginX-Proxy      true;
proxy_set_header X-Real-IP          $remote_addr;

# Numa identifies the API peer from this header on loopback connections, and
# nginx would forward a client-supplied one verbatim, drawing a 401.
proxy_set_header X-Numa-Client-Ip    "";
